name: Deploy DDL Atlas to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每小时检查一次上游 CCFDDL 数据，有变化才重新构建部署
    - cron: "17 * * * *"
  workflow_dispatch:
  # 允许通过 REST API 随时手动触发一次同步（POST /repos/xiaoxiaomiwang/ddl-atlas-cn/dispatches）
  repository_dispatch:
    types: [sync-now]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不允许取消进行中的部署，保护 push 触发的发布不被定时任务打断
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 显式版本：ubuntu-latest 是最拥挤的免费队列，显式版本排队通常更快
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史，便于数据变更后 rebase 回推
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Pull latest CCFDDL data
        run: git clone --depth 1 https://github.com/ccfddl/ccf-deadlines.git work/ccf-deadlines
      - name: Check whether upstream data changed
        id: upstream
        run: |
          NEW_SHA=$(git -C work/ccf-deadlines rev-parse HEAD)
          OLD_SHA=$(jq -r '.upstreamSha // empty' app/data-meta.json 2>/dev/null || true)
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$OLD_SHA" ] || [ "$OLD_SHA" != "$NEW_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed ($OLD_SHA -> $NEW_SHA); rebuilding."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged ($OLD_SHA); skipping scheduled rebuild."
          fi
      - name: Generate browser data
        if: steps.upstream.outputs.changed == 'true'
        run: |
          ruby work/build_conference_data.rb
          cp app/conferences.json public/conferences.json
          cp app/data-meta.json public/data-meta.json
      - name: Scrape review schedules from conference sites
        # 仅对 CCF A 类中缺人工核验日程的会议，自动解析官网评审节点（标注"未核验"）
        if: steps.upstream.outputs.changed == 'true'
        run: |
          if [ -f work/scrape_review_schedule.rb ]; then
            ruby work/scrape_review_schedule.rb || echo "scrape failed, keep existing data"
            cp app/auto-supplements.json public/auto-supplements.json
          else
            echo '{}' > app/auto-supplements.json
            cp app/auto-supplements.json public/auto-supplements.json
          fi
      - name: Scrape ARR cycles
        # 自动抓取 ACL Rolling Review 官方评审周期（aclrollingreview.org/dates）
        if: steps.upstream.outputs.changed == 'true'
        run: |
          if [ -f work/scrape_arr_cycles.rb ]; then
            ruby work/scrape_arr_cycles.rb || echo "arr scrape failed, keep existing data"
          fi
          if [ ! -f app/arr-cycles.json ]; then echo '[]' > app/arr-cycles.json; fi
          cp app/arr-cycles.json public/arr-cycles.json
      - run: pnpm install --frozen-lockfile
        if: steps.upstream.outputs.changed == 'true'
      - run: pnpm run build:github
        if: steps.upstream.outputs.changed == 'true'
      - uses: actions/configure-pages@v5
        if: steps.upstream.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: dist-github
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Commit refreshed data back to main
        # 定时/手动触发的数据同步才回推；[skip ci] 防止触发新的部署。
        # 回推本身也是仓库活动，可防止 GitHub 因 60 天无活动自动暂停定时任务。
        if: steps.upstream.outputs.changed == 'true' && github.event_name != 'push'
        run: |
          git config user.name "ddl-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/conferences.json app/data-meta.json app/auto-supplements.json app/arr-cycles.json public/conferences.json public/data-meta.json public/auto-supplements.json public/arr-cycles.json
          if git diff --staged --quiet; then
            echo "No data change to commit."
          else
            git commit -m "chore(data): sync CCFDDL upstream ${{ steps.upstream.outputs.new_sha }} [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Push rejected, rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi